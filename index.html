<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сервис Климат — кондиционеры в Самаре</title>

<style>
:root{
  --bg:#f5f6f3;
  --dark:#151815;
  --lime:#b8e83e;
  --muted:#6e746d;
  --line:#dfe3dc;
  --white:#fff;
  --radius:26px;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--dark);
  font-family:Inter,Arial,sans-serif;
  line-height:1.45;
}

body.lock{
  overflow:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.wrap{
  width:min(1180px,calc(100% - 40px));
  margin:auto;
}

/* TOP */

.top{
  font-size:13px;
  color:var(--muted);
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.top .wrap{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(245,246,243,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.nav{
  height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}
